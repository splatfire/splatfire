<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splatfire — 360° Room Tours</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <div class="brand">Splatfire <span>360° Room Tours</span></div>
    <input id="tour-name" type="text" value="Untitled tour" spellcheck="false" />
    <div class="topbar-actions">
      <div id="mode-toggle" role="group" aria-label="Mode">
        <button id="mode-edit" class="active">Edit</button>
        <button id="mode-view">View</button>
      </div>
      <button id="btn-add-rooms" title="Add 360° panorama images as rooms">+ Add rooms</button>
      <button id="btn-demo" title="Load a generated demo tour">Demo tour</button>
      <button id="btn-export" title="Download the tour as a shareable file">Export</button>
      <button id="btn-import" title="Open an exported tour file">Import</button>
      <button id="btn-new" title="Start a new empty tour">New</button>
      <button id="btn-fullscreen" title="Toggle fullscreen">⛶</button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="sidebar-title">Rooms</div>
      <ul id="scene-list"></ul>
    </aside>

    <main id="stage">
      <div id="viewer"></div>

      <div id="edit-tools" class="floating">
        <button id="btn-add-link">+ Room link</button>
        <button id="btn-add-note">+ Note</button>
        <button id="btn-set-view" title="Use the current view as this room's starting view">Set start view</button>
      </div>

      <div id="placement-hint" class="floating" hidden>
        Click anywhere in the panorama to place it — <button id="btn-cancel-place">cancel</button>
      </div>

      <div id="empty-state" hidden>
        <h1>No rooms yet</h1>
        <p>Add 360° panorama images (equirectangular JPG/PNG) to start building a tour,
           or load the demo tour to look around.</p>
        <div>
          <button id="btn-empty-add">+ Add rooms</button>
          <button id="btn-empty-demo">Load demo tour</button>
        </div>
      </div>
    </main>
  </div>

  <dialog id="dlg-link">
    <form method="dialog">
      <h2>Room link</h2>
      <label>Goes to
        <select id="link-target"></select>
      </label>
      <div class="dlg-actions">
        <button value="delete" id="link-delete" class="danger" hidden>Delete</button>
        <button value="cancel">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-note">
    <form method="dialog">
      <h2>Note</h2>
      <label>Title
        <input id="note-title" type="text" required />
      </label>
      <label>Text
        <textarea id="note-text" rows="4"></textarea>
      </label>
      <div class="dlg-actions">
        <button value="delete" id="note-delete" class="danger" hidden>Delete</button>
        <button value="cancel">Cancel</button>
        <button value="ok" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-note-view">
    <form method="dialog">
      <h2 id="note-view-title"></h2>
      <p id="note-view-text"></p>
      <div class="dlg-actions">
        <button value="ok" class="primary">Close</button>
      </div>
    </form>
  </dialog>

  <input id="file-rooms" type="file" accept="image/*" multiple hidden />
  <input id="file-import" type="file" accept=".json,application/json" hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
