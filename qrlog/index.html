<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>QR-Logbuch — Anlagen dokumentieren</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <header id="topbar">
    <a class="brand" href="#/">QR-Logbuch</a>
    <div class="topbar-actions">
      <button id="btn-scan" class="primary" title="QR-Code scannen">📷 Scannen</button>
      <button id="btn-menu" aria-label="Menü" aria-expanded="false">☰</button>
    </div>
    <nav id="menu" hidden>
      <a href="#/">Alle Anlagen</a>
      <a href="#/labels">Etiketten drucken</a>
      <a href="#/settings">Einstellungen</a>
      <button id="btn-export">Daten exportieren</button>
      <button id="btn-import">Daten importieren</button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Scanner -->
  <div id="scanner" class="overlay" hidden>
    <video id="scanner-video" muted playsinline></video>
    <div class="scanner-frame" aria-hidden="true"></div>
    <p id="scanner-hint">QR-Code auf der Anlage anvisieren</p>
    <div class="scanner-actions">
      <button id="scanner-file">Aus Foto lesen</button>
      <button id="scanner-close" class="primary">Abbrechen</button>
    </div>
  </div>

  <!-- One microphone for the whole form, reachable with the thumb. -->
  <button id="btn-ramble" class="fab" hidden aria-label="Alle Felder diktieren">🎤</button>

  <div id="ramble-sheet" class="overlay sheet" hidden>
    <div class="sheet-body">
      <section id="ramble-step-input">
        <h1 id="ramble-title">Einfach erzählen</h1>
        <p class="muted" id="ramble-hint"></p>
        <textarea id="ramble-input" rows="7" placeholder="Sprechen oder tippen …"></textarea>
        <p class="interim" id="ramble-interim" aria-live="polite"></p>
        <p class="muted" id="ramble-mode"></p>
        <div class="row">
          <button type="button" id="ramble-record" hidden>🎤 Aufnahme starten</button>
        </div>
        <div class="row">
          <button type="button" id="ramble-analyze" class="primary big">Felder ausfüllen</button>
          <button type="button" id="ramble-cancel">Abbrechen</button>
        </div>
      </section>

      <section id="ramble-step-proposal" hidden>
        <h1>Vorschlag</h1>
        <p class="muted">Übernommen wird nur, was angehakt ist.</p>
        <div id="ramble-proposal"></div>
        <details id="ramble-raw"><summary>Gesagter Text</summary><p></p></details>
        <div class="row">
          <button type="button" id="ramble-apply" class="primary big">Übernehmen</button>
          <button type="button" id="ramble-all-text">Alles in ein Feld</button>
          <button type="button" id="ramble-back">Zurück zum Text</button>
          <button type="button" id="ramble-discard">Verwerfen</button>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <input id="file-import" type="file" accept="application/json,.json" hidden />
  <input id="file-photo" type="file" accept="image/*" capture="environment" hidden />
  <input id="file-scan" type="file" accept="image/*" hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
